<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121519" />
      <stop offset="50%" stop-color="#181C22" />
      <stop offset="100%" stop-color="#0E1114" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232A34" />
      <stop offset="100%" stop-color="#191F27" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#83B1AF" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#83B1AF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22C55E" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>

    <!-- Embedded CSS Animation -->
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 48; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        100% { r: 14px; opacity: 0; }
      }
      @keyframes statusBlink {
        0%, 100% { fill: #22C55E; }
        50% { fill: #86EFAC; }
      }

      .flow-cyan {
        stroke: #38BDF8;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.6s linear infinite;
      }
      .flow-teal {
        stroke: #83B1AF;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.8s linear infinite;
      }
      .flow-green {
        stroke: #22C55E;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.4s linear infinite;
      }
      .flow-amber {
        stroke: #F59E0B;
        stroke-dasharray: 6 6;
        animation: dashFlowReverse 2s linear infinite;
      }
      .beacon-ring {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .status-dot {
        animation: statusBlink 1.5s ease-in-out infinite;
      }
      .pulse-beacon {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .hud-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="480" rx="20" fill="url(#bgGrad)" stroke="#26303B" stroke-width="1.5" />

  <!-- Subtle Tactical Grid Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="880" y1="0" x2="880" y2="480" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="360" x2="960" y2="360" />
  </g>

  <!-- Top Title Bar / HUD Header -->
  <g transform="translate(36, 32)">
    <circle cx="6" cy="6" r="4" fill="#22C55E" class="status-dot" />
    <circle cx="6" cy="6" r="4" stroke="#22C55E" stroke-width="1.5" fill="none" class="beacon-ring" />
    <text x="20" y="10" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="2" class="hud-text">
      FLEETCOM AI • DETERMINISTIC AGENTIC WORKFLOW (DAW) ENGINE
    </text>
    <text x="740" y="10" fill="#64748B" font-size="10" font-weight="600" letter-spacing="1.5" class="hud-text">
      PIPELINE STATUS: ACTIVE [100% REPRODUCIBLE]
    </text>
  </g>

  <!-- ==================== FLOW PATHWAYS (ANIMATED) ==================== -->
  <g fill="none" stroke-width="2">
    <!-- Path 1: Ingress -> Orchestrator -->
    <path d="M 160 230 L 250 230" class="flow-cyan" marker-end="url(#arrowCyan)" />

    <!-- Pathways: Orchestrator -> 3 Spot-Calls -->
    <path d="M 470 200 C 510 200, 520 140, 560 140" class="flow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 470 230 L 560 230" class="flow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 470 260 C 510 260, 520 320, 560 320" class="flow-cyan" marker-end="url(#arrowCyan)" />

    <!-- Pathways: 3 Spot-Calls -> Verification Cascade -->
    <path d="M 720 140 C 745 140, 750 200, 780 215" class="flow-teal" />
    <path d="M 720 230 L 780 230" class="flow-teal" />
    <path d="M 720 320 C 745 320, 750 260, 780 245" class="flow-teal" />

    <!-- Path 4: Verification -> Human Action Card -->
    <path d="M 890 230 L 920 230" class="flow-green" marker-end="url(#arrowGreen)" />

    <!-- Feedback Loop: Verification Gate -> Orchestrator (Bounded Retry) -->
    <path d="M 835 295 C 835 410, 360 410, 360 295" class="flow-amber" marker-end="url(#arrowAmber)" />
  </g>

  <!-- ==================== STAGE 1: INGRESS NODE ==================== -->
  <g transform="translate(36, 175)">
    <rect width="124" height="110" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <rect width="124" height="110" rx="14" fill="#38BDF8" opacity="0.04" class="pulse-beacon" />
    
    <!-- Icon: Radar Pulse -->
    <circle cx="62" cy="40" r="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <circle cx="62" cy="40" r="8" fill="#38BDF8" opacity="0.8" />
    <circle cx="62" cy="40" r="4" stroke="#38BDF8" stroke-width="1.5" fill="none" class="beacon-ring" />

    <text x="62" y="74" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700" class="hud-text">
      User Trigger
    </text>
    <text x="62" y="90" text-anchor="middle" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="0.5" class="hud-text">
      Event / Webhook
    </text>
  </g>

  <!-- ==================== STAGE 2: COMPILED CODE ORCHESTRATOR ==================== -->
  <g transform="translate(250, 160)">
    <rect width="220" height="140" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.8" filter="url(#cyanGlow)" />
    
    <!-- Card Header Badge -->
    <rect x="14" y="14" width="192" height="24" rx="6" fill="#0C4A6E" opacity="0.6" />
    <text x="110" y="30" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="800" letter-spacing="1" class="hud-text">
      COMPILED CODE ORCHESTRATOR
    </text>

    <!-- Main Title -->
    <text x="110" y="66" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800" class="hud-text">
      Python / LangGraph
    </text>
    <text x="110" y="84" text-anchor="middle" fill="#83B1AF" font-size="11" font-weight="600" class="hud-text">
      Deterministic State Machine
    </text>

    <!-- Divider Line -->
    <line x1="20" y1="98" x2="200" y2="98" stroke="#334155" stroke-width="1" />

    <!-- Badges -->
    <rect x="24" y="108" width="80" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8" />
    <text x="64" y="121" text-anchor="middle" fill="#7DD3FC" font-size="8.5" font-weight="700" class="hud-text">
      Code Control Flow
    </text>

    <rect x="116" y="108" width="80" height="18" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="0.8" />
    <text x="156" y="121" text-anchor="middle" fill="#86EFAC" font-size="8.5" font-weight="700" class="hud-text">
      P = 1.0 Routing
    </text>
  </g>

  <!-- ==================== STAGE 3: SURGICAL SPOT-CALL NODES ==================== -->
  <!-- Spot-Call A: Entity Extraction -->
  <g transform="translate(560, 95)">
    <rect width="160" height="70" rx="10" fill="url(#cardGrad)" stroke="#83B1AF" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#83B1AF" />
    <text x="32" y="27" fill="#F8FAFC" font-size="11" font-weight="700" class="hud-text">
      Entity Extraction
    </text>
    <text x="32" y="44" fill="#94A3B8" font-size="9" font-weight="500" class="hud-text">
      Atomic Spot-Call (9B/Flash)
    </text>
    <text x="32" y="58" fill="#38BDF8" font-size="8.5" font-weight="700" class="hud-text">
      Schema: JSON Payloads
    </text>
  </g>

  <!-- Spot-Call B: Intent Classification -->
  <g transform="translate(560, 195)">
    <rect width="160" height="70" rx="10" fill="url(#cardGrad)" stroke="#83B1AF" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#83B1AF" />
    <text x="32" y="27" fill="#F8FAFC" font-size="11" font-weight="700" class="hud-text">
      Intent Routing
    </text>
    <text x="32" y="44" fill="#94A3B8" font-size="9" font-weight="500" class="hud-text">
      Calibrated Spot-Call (30ms)
    </text>
    <text x="32" y="58" fill="#38BDF8" font-size="8.5" font-weight="700" class="hud-text">
      Schema: Enum Constraints
    </text>
  </g>

  <!-- Spot-Call C: Schema Synthesis -->
  <g transform="translate(560, 295)">
    <rect width="160" height="70" rx="10" fill="url(#cardGrad)" stroke="#83B1AF" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#83B1AF" />
    <text x="32" y="27" fill="#F8FAFC" font-size="11" font-weight="700" class="hud-text">
      Artifact Synthesis
    </text>
    <text x="32" y="44" fill="#94A3B8" font-size="9" font-weight="500" class="hud-text">
      Surgical LLM Code Gen
    </text>
    <text x="32" y="58" fill="#38BDF8" font-size="8.5" font-weight="700" class="hud-text">
      Schema: Pydantic v2
    </text>
  </g>

  <!-- ==================== STAGE 4: VERIFICATION CASCADE ==================== -->
  <g transform="translate(780, 165)">
    <rect width="110" height="130" rx="14" fill="url(#cardGrad)" stroke="#22C55E" stroke-width="1.5" filter="url(#greenGlow)" />
    
    <!-- Shield Icon -->
    <path d="M 55 22 L 75 32 L 75 52 C 75 66 55 76 55 76 C 55 76 35 66 35 52 L 35 32 Z" 
          fill="#14532D" stroke="#22C55E" stroke-width="1.5" />
    <path d="M 48 48 L 53 53 L 63 43" stroke="#86EFAC" stroke-width="2" fill="none" stroke-linecap="round" />

    <text x="55" y="94" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800" class="hud-text">
      Verification
    </text>
    <text x="55" y="108" text-anchor="middle" fill="#86EFAC" font-size="9" font-weight="600" class="hud-text">
      Level 0-2 Oracles
    </text>
    <text x="55" y="122" text-anchor="middle" fill="#94A3B8" font-size="8" font-weight="500" class="hud-text">
      AST • Tests • Types
    </text>
  </g>

  <!-- Retry Badge on loop line -->
  <g transform="translate(560, 420)">
    <rect x="-80" y="-12" width="160" height="24" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#FDE68A" font-size="9" font-weight="700" letter-spacing="0.5" class="hud-text">
      Bounded Repair (Max 1 Retry)
    </text>
  </g>

  <!-- ==================== BOTTOM HUD FOOTER ==================== -->
  <g transform="translate(36, 442)">
    <text x="0" y="0" fill="#64748B" font-size="9.5" font-weight="600" letter-spacing="1" class="hud-text">
      INPUT CONTRACT: ISOLATED JSON / YAML
    </text>
    <text x="360" y="0" fill="#64748B" font-size="9.5" font-weight="600" letter-spacing="1" class="hud-text">
      EXECUTION: LOCAL 9B/27B OR FLASH
    </text>
    <text x="700" y="0" fill="#22C55E" font-size="9.5" font-weight="700" letter-spacing="1" class="hud-text">
      OUTPUT: 100% DETERMINISTIC ARTIFACT
    </text>
  </g>
</svg>
