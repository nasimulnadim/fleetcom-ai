<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1216" />
      <stop offset="50%" stop-color="#161A20" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>

    <!-- Card Dark Gradient -->
    <linearGradient id="cardDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E252F" />
      <stop offset="100%" stop-color="#131820" />
    </linearGradient>

    <linearGradient id="emeraldCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132B24" />
      <stop offset="100%" stop-color="#0E1E1A" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#83B1AF" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22C55E" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>

    <!-- Animations -->
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 48; }
      }
      @keyframes beaconPing {
        0% { r: 3px; opacity: 1; }
        100% { r: 12px; opacity: 0; }
      }
      @keyframes statusBlink {
        0%, 100% { fill: #22C55E; }
        50% { fill: #86EFAC; }
      }

      .flow-cyan {
        stroke: #38BDF8;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.6s linear infinite;
      }
      .flow-teal {
        stroke: #83B1AF;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.8s linear infinite;
      }
      .flow-green {
        stroke: #22C55E;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.4s linear infinite;
      }
      .flow-amber {
        stroke: #F59E0B;
        stroke-dasharray: 6 6;
        animation: dashFlowReverse 2s linear infinite;
      }
      .status-dot {
        animation: statusBlink 1.5s ease-in-out infinite;
      }
      .beacon-ring {
        animation: beaconPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .hud-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="500" rx="20" fill="url(#bgGrad)" stroke="#26303B" stroke-width="1.5" />

  <!-- Subtle Tactical Grid Overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="380" y1="0" x2="380" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="780" y1="0" x2="780" y2="500" />
    <line x1="0" y1="65" x2="960" y2="65" />
    <line x1="0" y1="220" x2="960" y2="220" />
    <line x1="0" y1="415" x2="960" y2="415" />
  </g>

  <!-- Top Title HUD -->
  <g transform="translate(32, 30)">
    <circle cx="6" cy="6" r="4" fill="#22C55E" class="status-dot" />
    <circle cx="6" cy="6" r="4" stroke="#22C55E" stroke-width="1.5" fill="none" class="beacon-ring" />
    <text x="20" y="10" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="2" class="hud-text">
      FLEETCOM AI • THE DETERMINISTIC SOLUTION: COMPILED DAW ORCHESTRATION
    </text>
    <text x="896" y="10" text-anchor="end" fill="#22C55E" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono-text">
      P(routing) = 1.0 • ZERO DRIFT • MISSION-CRITICAL
    </text>
  </g>

  <!-- ==================== FLOW PATHWAYS (ANIMATED) ==================== -->
  <g fill="none" stroke-width="2">
    <!-- Ingress -> Orchestrator -->
    <path d="M 166 220 L 222 220" class="flow-cyan" marker-end="url(#arrowCyan)" />

    <!-- Orchestrator -> 3 Spot-Calls -->
    <path d="M 460 190 C 495 190, 505 130, 545 130" class="flow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 460 220 L 545 220" class="flow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 460 250 C 495 250, 505 310, 545 310" class="flow-cyan" marker-end="url(#arrowCyan)" />

    <!-- 3 Spot-Calls -> Verification Cascade -->
    <path d="M 725 130 C 750 130, 755 190, 785 205" class="flow-teal" />
    <path d="M 725 220 L 785 220" class="flow-teal" />
    <path d="M 725 310 C 750 310, 755 250, 785 235" class="flow-teal" />

    <!-- Verification -> Success (Right) -->
    <path d="M 905 220 L 935 220" class="flow-green" marker-end="url(#arrowGreen)" />

    <!-- Bounded Repair Loop (Arc at y=390, generously clear of footer) -->
    <path d="M 845 290 C 845 390, 345 390, 345 295" class="flow-amber" marker-end="url(#arrowAmber)" />
  </g>

  <!-- ==================== STAGE 1: INGRESS ==================== -->
  <g transform="translate(32, 120)">
    <rect width="134" height="200" rx="14" fill="url(#cardDarkGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="10" y="10" width="114" height="22" rx="5" fill="#0C4A6E" opacity="0.6" />
    <text x="67" y="25" text-anchor="middle" fill="#38BDF8" font-size="9" font-weight="800" class="hud-text">STAGE 1 • INGRESS</text>
    
    <g transform="translate(67, 95)">
      <ellipse cx="0" cy="27.36" rx="21.599999999999998" ry="5.76" fill="rgba(0,0,0,0.35)" />
      
          <ellipse cx="0" cy="-48.96" rx="23.04" ry="5.76" fill="none" stroke="#38BDF8" stroke-width="1.44" stroke-dasharray="4 3" filter="url(#cyanGlow)" />
        
      <rect x="-1.44" y="-37.44" width="2.88" height="10.08" rx="1.44" fill="#0369A1" />
      <circle cx="0" cy="-40.32" r="3.96" fill="#38BDF8" filter="url(#cyanGlow)" />
      <circle cx="-0.864" cy="-41.4" r="1.152" fill="#FFFFFF" opacity="0.8" />
      <rect x="-23.04" y="-28.799999999999997" width="46.08" height="53.28" rx="23.04" fill="#0284C7" />
      <path d="M 0 -28.799999999999997 C 12.959999999999999 -28.799999999999997 23.04 -15.84 23.04 0 L 23.04 8.64 C 23.04 21.599999999999998 12.959999999999999 28.799999999999997 0 28.799999999999997 C 11.52 27.36 18.0 15.84 18.0 0 L 18.0 -12.959999999999999 C 18.0 -24.48 9.36 -28.08 0 -28.799999999999997 Z" fill="#0369A1" />
      <rect x="-17.28" y="-15.84" width="34.56" height="21.599999999999998" rx="10.799999999999999" fill="#082F49" stroke="rgba(255,255,255,0.15)" stroke-width="0.72" />
      
          <ellipse cx="-9.36" cy="-4.32" rx="5.04" ry="5.76" fill="#38BDF8" />
          <circle cx="-10.799999999999999" cy="-5.76" r="1.7999999999999998" fill="#FFFFFF" />
          <ellipse cx="9.36" cy="-4.32" rx="5.04" ry="5.76" fill="#38BDF8" />
          <circle cx="7.92" cy="-5.76" r="1.7999999999999998" fill="#FFFFFF" />
        
    </g>
    
    <text x="67" y="160" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="700" class="hud-text">Typed Ingress</text>
    <text x="67" y="175" text-anchor="middle" fill="#94A3B8" font-size="8.5" class="mono-text">Event / Webhook</text>
    <text x="67" y="190" text-anchor="middle" fill="#38BDF8" font-size="8" font-weight="700" class="mono-text">JSON Schema</text>
  </g>

  <!-- ==================== STAGE 2: COMPILED CODE ORCHESTRATOR ==================== -->
  <g transform="translate(225, 110)">
    <rect width="235" height="220" rx="14" fill="url(#cardDarkGrad)" stroke="#38BDF8" stroke-width="1.8" filter="url(#cyanGlow)" />
    <rect x="14" y="12" width="207" height="24" rx="6" fill="#0C4A6E" opacity="0.6" />
    <text x="117" y="28" text-anchor="middle" fill="#38BDF8" font-size="9.5" font-weight="800" letter-spacing="1" class="hud-text">
      COMPILED CODE ORCHESTRATOR
    </text>

    <text x="117" y="68" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800" class="hud-text">
      Python / LangGraph
    </text>
    <text x="117" y="88" text-anchor="middle" fill="#83B1AF" font-size="11" font-weight="600" class="hud-text">
      Deterministic State Machine
    </text>

    <!-- Code badges -->
    <rect x="22" y="108" width="191" height="44" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="117" y="126" text-anchor="middle" fill="#86EFAC" font-size="10" font-weight="800" class="mono-text">
      Macro Routing: P = 1.0
    </text>
    <text x="117" y="142" text-anchor="middle" fill="#94A3B8" font-size="8.5" class="mono-text">
      Zero LLM in Control Flow
    </text>

    <rect x="22" y="162" width="90" height="20" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8" />
    <text x="67" y="176" text-anchor="middle" fill="#7DD3FC" font-size="8" font-weight="700" class="hud-text">Code State</text>

    <rect x="123" y="162" width="90" height="20" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="0.8" />
    <text x="168" y="176" text-anchor="middle" fill="#86EFAC" font-size="8" font-weight="700" class="hud-text">FastMCP Bus</text>

    <text x="117" y="204" text-anchor="middle" fill="#64748B" font-size="8" class="mono-text">Surgical Spot-Call Dispatch</text>
  </g>

  <!-- ==================== STAGE 3: 3 ATOMIC SPOT-CALLS ==================== -->
  <!-- Spot 1: Extraction -->
  <g transform="translate(545, 90)">
    <rect width="180" height="75" rx="10" fill="url(#cardDarkGrad)" stroke="#83B1AF" stroke-width="1.2" />
    
    <g transform="translate(28, 38)">
      <ellipse cx="0" cy="17.1" rx="13.5" ry="3.6" fill="rgba(0,0,0,0.35)" />
      
      <rect x="-0.9" y="-23.400000000000002" width="1.8" height="6.3" rx="0.9" fill="#0F766E" />
      <circle cx="0" cy="-25.2" r="2.475" fill="#2DD4BF" filter="url(#cyanGlow)" />
      <circle cx="-0.54" cy="-25.875" r="0.7200000000000001" fill="#FFFFFF" opacity="0.8" />
      <rect x="-14.4" y="-18.0" width="28.8" height="33.300000000000004" rx="14.4" fill="#0D9488" />
      <path d="M 0 -18.0 C 8.1 -18.0 14.4 -9.9 14.4 0 L 14.4 5.4 C 14.4 13.5 8.1 18.0 0 18.0 C 7.2 17.1 11.25 9.9 11.25 0 L 11.25 -8.1 C 11.25 -15.3 5.8500000000000005 -17.55 0 -18.0 Z" fill="#0F766E" />
      <rect x="-10.8" y="-9.9" width="21.6" height="13.5" rx="6.75" fill="#042F2E" stroke="rgba(255,255,255,0.15)" stroke-width="0.45" />
      
          <!-- Rectangular terminal glasses / focused eyes -->
          <rect x="-9.0" y="-4.5" width="7.2" height="4.5" rx="1.35" fill="#5EEAD4" />
          <rect x="1.8" y="-4.5" width="7.2" height="4.5" rx="1.35" fill="#5EEAD4" />
          <line x1="-1.8" y1="-2.25" x2="1.8" y2="-2.25" stroke="#5EEAD4" stroke-width="0.9" />
        
    </g>
    
    <text x="56" y="25" fill="#F8FAFC" font-size="10.5" font-weight="700" class="hud-text">Entity Extraction</text>
    <text x="56" y="42" fill="#94A3B8" font-size="8.5" class="mono-text">Atomic Spot-Call (9B)</text>
    <rect x="56" y="50" width="112" height="16" rx="3" fill="#0F172A" />
    <text x="112" y="62" text-anchor="middle" fill="#38BDF8" font-size="8" font-weight="700" class="mono-text">Schema: JSON Payload</text>
  </g>

  <!-- Spot 2: Intent -->
  <g transform="translate(545, 180)">
    <rect width="180" height="75" rx="10" fill="url(#cardDarkGrad)" stroke="#83B1AF" stroke-width="1.2" />
    
    <g transform="translate(28, 38)">
      <ellipse cx="0" cy="17.1" rx="13.5" ry="3.6" fill="rgba(0,0,0,0.35)" />
      
      <rect x="-0.9" y="-23.400000000000002" width="1.8" height="6.3" rx="0.9" fill="#0369A1" />
      <circle cx="0" cy="-25.2" r="2.475" fill="#38BDF8" filter="url(#cyanGlow)" />
      <circle cx="-0.54" cy="-25.875" r="0.7200000000000001" fill="#FFFFFF" opacity="0.8" />
      <rect x="-14.4" y="-18.0" width="28.8" height="33.300000000000004" rx="14.4" fill="#0284C7" />
      <path d="M 0 -18.0 C 8.1 -18.0 14.4 -9.9 14.4 0 L 14.4 5.4 C 14.4 13.5 8.1 18.0 0 18.0 C 7.2 17.1 11.25 9.9 11.25 0 L 11.25 -8.1 C 11.25 -15.3 5.8500000000000005 -17.55 0 -18.0 Z" fill="#0369A1" />
      <rect x="-10.8" y="-9.9" width="21.6" height="13.5" rx="6.75" fill="#082F49" stroke="rgba(255,255,255,0.15)" stroke-width="0.45" />
      
          <circle cx="-6.3" cy="-2.7" r="3.15" fill="#38BDF8" />
          <circle cx="-7.2" cy="-3.6" r="1.125" fill="#FFFFFF" />
          <circle cx="6.3" cy="-2.7" r="3.15" fill="#38BDF8" />
          <circle cx="5.4" cy="-3.6" r="1.125" fill="#FFFFFF" />
        
    </g>
    
    <text x="56" y="25" fill="#F8FAFC" font-size="10.5" font-weight="700" class="hud-text">Intent Routing</text>
    <text x="56" y="42" fill="#94A3B8" font-size="8.5" class="mono-text">Calibrated Spot-Call (~30ms)</text>
    <rect x="56" y="50" width="112" height="16" rx="3" fill="#0F172A" />
    <text x="112" y="62" text-anchor="middle" fill="#38BDF8" font-size="8" font-weight="700" class="mono-text">Schema: Strict Enums</text>
  </g>

  <!-- Spot 3: Synthesis -->
  <g transform="translate(545, 270)">
    <rect width="180" height="75" rx="10" fill="url(#cardDarkGrad)" stroke="#83B1AF" stroke-width="1.2" />
    
    <g transform="translate(28, 38)">
      <ellipse cx="0" cy="17.1" rx="13.5" ry="3.6" fill="rgba(0,0,0,0.35)" />
      
      <rect x="-0.9" y="-23.400000000000002" width="1.8" height="6.3" rx="0.9" fill="#6D28D9" />
      <circle cx="0" cy="-25.2" r="2.475" fill="#A78BFA" filter="url(#cyanGlow)" />
      <circle cx="-0.54" cy="-25.875" r="0.7200000000000001" fill="#FFFFFF" opacity="0.8" />
      <rect x="-14.4" y="-18.0" width="28.8" height="33.300000000000004" rx="14.4" fill="#7C3AED" />
      <path d="M 0 -18.0 C 8.1 -18.0 14.4 -9.9 14.4 0 L 14.4 5.4 C 14.4 13.5 8.1 18.0 0 18.0 C 7.2 17.1 11.25 9.9 11.25 0 L 11.25 -8.1 C 11.25 -15.3 5.8500000000000005 -17.55 0 -18.0 Z" fill="#6D28D9" />
      <rect x="-10.8" y="-9.9" width="21.6" height="13.5" rx="6.75" fill="#2E1065" stroke="rgba(255,255,255,0.15)" stroke-width="0.45" />
      
          <circle cx="-6.3" cy="-2.7" r="3.375" fill="#C4B5FD" />
          <circle cx="-7.2" cy="-3.6" r="1.26" fill="#FFFFFF" />
          <circle cx="6.3" cy="-2.7" r="3.375" fill="#C4B5FD" />
          <circle cx="5.4" cy="-3.6" r="1.26" fill="#FFFFFF" />
        
    </g>
    
    <text x="56" y="25" fill="#F8FAFC" font-size="10.5" font-weight="700" class="hud-text">Schema Synthesis</text>
    <text x="56" y="42" fill="#94A3B8" font-size="8.5" class="mono-text">Local 9B/27B or Flash</text>
    <rect x="56" y="50" width="112" height="16" rx="3" fill="#0F172A" />
    <text x="112" y="62" text-anchor="middle" fill="#38BDF8" font-size="8" font-weight="700" class="mono-text">Schema: Pydantic v2</text>
  </g>

  <!-- ==================== STAGE 4: VERIFICATION CASCADE ==================== -->
  <g transform="translate(785, 140)">
    <rect width="120" height="150" rx="14" fill="url(#emeraldCardGrad)" stroke="#22C55E" stroke-width="1.6" filter="url(#greenGlow)" />
    
    <!-- Shield -->
    <path d="M 60 22 L 80 32 L 80 54 C 80 68 60 78 60 78 C 60 78 40 68 40 54 L 40 32 Z" fill="#064E3B" stroke="#22C55E" stroke-width="1.5" />
    <path d="M 53 50 L 58 55 L 68 45" stroke="#86EFAC" stroke-width="2" fill="none" stroke-linecap="round" />

    <text x="60" y="98" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800" class="hud-text">
      Verification
    </text>
    <text x="60" y="114" text-anchor="middle" fill="#86EFAC" font-size="9" font-weight="700" class="mono-text">
      System 0 Oracles
    </text>
    <text x="60" y="128" text-anchor="middle" fill="#94A3B8" font-size="8" class="mono-text">
      AST • Linters • Tests
    </text>
    <text x="60" y="140" text-anchor="middle" fill="#22C55E" font-size="8" font-weight="800" class="hud-text">
      P = 1.0 GATE
    </text>
  </g>

  <!-- Bounded Repair Badge (at y=390, generous 55px buffer to footer) -->
  <g transform="translate(560, 390)">
    <rect x="-90" y="-12" width="180" height="24" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#FDE68A" font-size="9" font-weight="700" letter-spacing="0.5" class="hud-text">
      Bounded Repair (Max 1 Retry)
    </text>
  </g>

  <!-- ==================== BOTTOM HUD FOOTER ==================== -->
  <g transform="translate(32, 455)">
    <rect width="896" height="32" rx="6" fill="#022C22" stroke="#22C55E" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#22C55E" class="status-dot" />
    <text x="34" y="20" fill="#FFFFFF" font-size="10.5" font-weight="800" class="hud-text">
      FLEETCOM DAW STANDARD:
    </text>
    <text x="210" y="20" fill="#86EFAC" font-size="10" font-weight="600" class="mono-text">
      Routing in Code + Atomic Spot-Calls = 100% Deterministic Reproducibility at bash.00 Local AI Cost.
    </text>
  </g>
</svg>