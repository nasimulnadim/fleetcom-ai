    </text>
    <text x="896" y="10" text-anchor="end" fill="#EF4444" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono-text">
      P(system) = ∏ P_step = 0.85 ⁵ = 44.37%
    </text>
  </g>

