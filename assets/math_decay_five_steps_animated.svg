<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1216" />
      <stop offset="50%" stop-color="#161A20" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E252F" />
      <stop offset="100%" stop-color="#131820" />
    </linearGradient>

    <linearGradient id="dangerCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B141A" />
      <stop offset="100%" stop-color="#1A0C10" />
    </linearGradient>

    <!-- Curve Line Gradient -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes beaconPing {
        0% { r: 3px; opacity: 1; }
        100% { r: 12px; opacity: 0; }
      }
      @keyframes dangerBlink {
        0%, 100% { fill: #EF4444; }
        50% { fill: #FCA5A5; }
      }
      @keyframes pulseBanner {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }

      .flow-curve {
        stroke: url(#curveGrad);
        stroke-dasharray: 6 6;
        animation: dashFlow 2s linear infinite;
      }
      .status-danger {
        animation: dangerBlink 1.4s ease-in-out infinite;
      }
      .beacon-ring {
        animation: beaconPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .hud-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="450" rx="20" fill="url(#bgGrad)" stroke="#26303B" stroke-width="1.5" />

  <!-- Subtle Tactical Grid Overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="192" y1="0" x2="192" y2="450" />
    <line x1="384" y1="0" x2="384" y2="450" />
    <line x1="576" y1="0" x2="576" y2="450" />
    <line x1="768" y1="0" x2="768" y2="450" />
    <line x1="0" y1="65" x2="960" y2="65" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="375" x2="960" y2="375" />
  </g>

  <!-- Top Title HUD -->
  <g transform="translate(32, 30)">
    <circle cx="6" cy="6" r="4" fill="#EF4444" class="status-danger" />
    <circle cx="6" cy="6" r="4" stroke="#EF4444" stroke-width="1.5" fill="none" class="beacon-ring" />
    <text x="20" y="10" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="2" class="hud-text">
